name: "Terraform / Terragrunt CI"

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    name: "Validate Infrastructure"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.8.2"

      - name: Setup Terragrunt
        uses: autero1/action-terragrunt@aefb0a43c4f5503a91fefb307745c4d51c26ed0e # v3.0.2
        with:
          terragrunt-version: "0.58.0"

      - name: Setup Terraform Plugin Cache
        run: |
          mkdir -p ${{ github.workspace }}/.cache/terragrunt/providers
          echo "TERRAGRUNT_PROVIDER_CACHE=1" >> $GITHUB_ENV
          echo "TERRAGRUNT_PROVIDER_CACHE_DIR=${{ github.workspace }}/.cache/terragrunt/providers" >> $GITHUB_ENV

      - name: Cache Terraform Plugins
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ${{ github.workspace }}/.cache/terragrunt/providers
          key: terraform-plugin-cache-${{ runner.os }}-${{ hashFiles('terragrunt.hcl') }}
          restore-keys: |
            terraform-plugin-cache-${{ runner.os }}-

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terragrunt Validate
        run: terragrunt run-all validate
        env:
          TF_VAR_proxmox_endpoint: "https://localhost:8006/"
          TF_VAR_proxmox_api_token: "dummy-token-for-validation"
