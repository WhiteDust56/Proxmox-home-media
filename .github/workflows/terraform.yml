name: "Terraform / Terragrunt CI"

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    name: "Validate Infrastructure"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.2"

      - name: Setup Terragrunt
        uses: autero1/action-terragrunt@v3
        with:
          terragrunt-version: "0.58.0"

      - name: Setup Terragrunt Provider Cache
        run: |
          # Use Terragrunt's native provider cache to prevent redundant downloads and race conditions during concurrent runs
          mkdir -p ${{ github.workspace }}/.cache/terragrunt/providers
          echo "TERRAGRUNT_PROVIDER_CACHE=1" >> $GITHUB_ENV
          echo "TERRAGRUNT_PROVIDER_CACHE_DIR=${{ github.workspace }}/.cache/terragrunt/providers" >> $GITHUB_ENV

      - name: Cache Terragrunt Providers
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/terragrunt/providers
          key: terragrunt-provider-cache-${{ runner.os }}-${{ hashFiles('terragrunt.hcl') }}
          restore-keys: |
            terragrunt-provider-cache-${{ runner.os }}-

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terragrunt Validate
        run: terragrunt run-all validate
        env:
          TF_VAR_proxmox_endpoint: "https://localhost:8006/"
          TF_VAR_proxmox_api_token: "dummy-token-for-validation"
